services:
  db:
    image: mysql:8.4
    container_name: sjc-documents-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: school_document_request
      MYSQL_USER: ${DB_USER:-sjc_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in your .env}
    ports:
      - "3306:3306"
    volumes:
      - sjc-db-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: sjc-documents-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/school_document_request?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila&characterEncoding=UTF-8
      DB_USER: ${DB_USER:-sjc_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  sjc-db-data:
