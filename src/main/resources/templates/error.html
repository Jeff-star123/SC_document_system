<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Unable to complete the request')}"></head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:var(--mist)">
    <div style="max-width:560px;width:100%;text-align:center">
        <div class="brand-mark" style="justify-content:center;margin-bottom:22px">
            <span class="brand-seal" style="border-color:var(--rule-strong);color:var(--navy)">SJC</span>
            <span>
                <span class="brand-name" style="color:var(--ink)" th:text="${institutionName}">Saint Jude College Manila</span>
                <span class="brand-sub">Records Office</span>
            </span>
        </div>

        <div class="panel">
            <div class="panel-body">
                <div class="eyebrow" style="color:var(--stamp)"
                     th:text="${status != null ? status + ' ' + error : 'Unexpected error'}">500 Internal Server Error</div>
                <h1 class="page-title mt-2">Unable to complete the request</h1>
                <p class="page-lede" style="margin:8px auto 0">
                    Something went wrong on our side. Please try again, or come back a little later.
                </p>
                <div class="mt-4 d-flex gap-2 justify-content-center">
                    <a class="btn btn-navy" th:href="@{/}">
                        <i class="bi bi-house" aria-hidden="true"></i> Back to dashboard
                    </a>
                </div>
            </div>
        </div>

        <p class="muted mt-3" style="font-size:12.5px">
            If this keeps happening, contact the registrar's office.
        </p>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
