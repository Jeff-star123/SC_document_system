spring:
  application:
    name: school-documents

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/school_document_request?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila&characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: sjc-documents-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Manila
          batch_size: 30
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

  web:
    resources:
      cache:
        period: 3600

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: SJC_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  forward-headers-strategy: native

app:
  # Role accounts are provisioned by an administrator after first login.
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:System}
    admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Administrator}
  # Development convenience only. Never enable in production.
  demo-data:
    enabled: ${SEED_DEMO_USERS:false}
    password: ${SEED_PASSWORD:}
  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:10}
  institution:
    name: Saint Jude College Manila
    system-name: School Documents Request System

logging:
  level:
    root: INFO
    com.sjc.schooldocuments: INFO
    org.hibernate.SQL: WARN
